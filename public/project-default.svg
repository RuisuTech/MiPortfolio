<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#08182b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="oceanGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.05" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ocean Glow -->
  <circle cx="600" cy="270" r="320" fill="url(#oceanGlow)" />

  <!-- Center Decorative Glow Halo -->
  <rect x="500" y="160" width="200" height="200" rx="52" fill="none" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.5" filter="url(#glow)" />
  
  <!-- Outer Card Container -->
  <rect x="500" y="160" width="200" height="200" rx="52" fill="#061224" stroke="url(#cyanBlueGrad)" stroke-width="2" />
  
  <!-- Inner Badge Container -->
  <rect x="515" y="175" width="170" height="170" rx="42" fill="#030712" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3" />

  <!-- Code2 Vector Icon Logo (Official Emblem) -->
  <g transform="translate(600, 260) scale(3.2)" text-anchor="middle">
    <path d="M-8 -6 L-16 0 L-8 6" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M8 -6 L16 0 L8 6" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M2 -10 L-2 10" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>

  <!-- Small corner indicator -->
  <circle cx="650" cy="205" r="5" fill="#22d3ee" />

  <!-- Typography Brand -->
  <text x="600" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    RUISU<tspan fill="#22d3ee">TECH</tspan>
  </text>
  <text x="600" y="455" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="600" font-size="13" letter-spacing="6" fill="#94a3b8">
    PROYECTO OFICIAL • GITHUB REPOSITORY
  </text>

  <!-- Bottom Accent bar -->
  <rect x="540" y="480" width="120" height="2" rx="1" fill="url(#cyanBlueGrad)" opacity="0.6" />
</svg>
